<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sampath Pawning</title>
    <script>
      // Apply the saved theme before first paint so there is no light flash (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('sampath.theme')
        // Dark unless the user chose light, or chose "system" and the OS is light.
        var dark = t === 'system' ? matchMedia('(prefers-color-scheme: dark)').matches : t !== 'light'
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
